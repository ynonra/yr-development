<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"></head>
<body style="background: var(--blush)">
  <div class="disc" style="width: 620px; height: 620px; left: -120px; top: 150px; background: var(--peri)"></div>

  <!-- the request -->
  <div class="chip" style="left: 610px; top: 60px; width: 520px; padding: 26px 30px">
    <div class="row soft" style="gap: 10px; font-size: 20px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--coral)"><path d="M12 1.5 C 13 8, 16 11, 22.5 12 C 16 13, 13 16, 12 22.5 C 11 16, 8 13, 1.5 12 C 8 11, 11 8, 12 1.5 Z" /></svg>
      בקשה ל-AI
    </div>
    <div class="between" style="margin-top: 14px; gap: 18px">
      <span class="sb" style="font-size: 30px; line-height: 1.3">תבנה לי אתר לעסק שלי, בעברית</span>
      <span style="flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--coral)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 V5 M5.5 11 L12 4.5 L18.5 11" /></svg>
      </span>
    </div>
  </div>

  <!-- what came out: left-aligned, punctuation on the wrong side, arrow pointing back -->
  <div class="chip" style="left: 70px; top: 200px; width: 540px; height: 380px; overflow: hidden">
    <div class="window-bar">
      <span class="dot" style="background: var(--coral)"></span>
      <span class="dot" style="background: var(--peri)"></span>
      <span class="dot" style="background: var(--line)"></span>
    </div>
    <div style="padding: 30px 34px; text-align: left">
      <div class="row" style="gap: 14px; direction: ltr">
        <span class="bar" style="width: 60px"></span><span class="bar" style="width: 60px"></span><span class="bar" style="width: 60px"></span>
      </div>
      <div class="display" style="margin-top: 34px; font-size: 54px; line-height: 1"><bdi dir="ltr">שלום!</bdi></div>
      <div class="bar" style="width: 300px; margin-top: 24px"></div>
      <div class="bar" style="width: 240px; margin-top: 12px"></div>
      <div style="margin-top: 30px; direction: ltr">
        <span class="pill sb" style="background: var(--ink); color: #fff; font-size: 22px; padding: 10px 24px"><bdi dir="ltr">המשך →</bdi></span>
      </div>
    </div>
  </div>

  <!-- hand-drawn circles around the bugs -->
  <svg class="drawn" style="left: 92px; top: 312px" width="210" height="96" viewBox="0 0 210 96">
    <path d="M150 10 C 60 0, 6 22, 10 52 C 14 84, 120 96, 186 72 C 214 60, 204 18, 140 8" />
  </svg>
  <svg class="drawn" style="left: 76px; top: 458px" width="200" height="84" viewBox="0 0 200 84">
    <path d="M140 8 C 60 0, 8 18, 10 44 C 12 74, 110 86, 176 64 C 204 52, 196 14, 130 6" />
  </svg>

  <div class="hand" style="left: 700px; top: 330px">רגע... למה זה הפוך?</div>
  <svg class="drawn" style="left: 300px; top: 320px" width="400" height="60" viewBox="0 0 400 60">
    <path d="M392 32 C 300 52, 120 50, 14 24 M14 24 L 30 14 M14 24 L 28 38" />
  </svg>
</body>
</html>
