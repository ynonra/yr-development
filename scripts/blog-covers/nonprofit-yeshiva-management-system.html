<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"></head>
<body style="background: var(--mist)">
  <div class="disc" style="width: 560px; height: 560px; left: 720px; top: 290px; background: var(--coral)"></div>

  <!-- donations board -->
  <div class="chip" style="left: 70px; top: 62px; width: 620px; padding: 30px 34px 26px">
    <div class="between">
      <span class="display" style="font-size: 36px">תרומות החודש</span>
      <span class="pill" style="background: var(--mist); font-size: 19px">כסלו תשפ״ז</span>
    </div>
    <div class="soft sb" style="display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; margin-top: 22px; font-size: 18px; padding: 0 4px 10px; border-bottom: 2px solid var(--line)">
      <span>תורם</span><span>סכום</span><span>תרומות ישראל</span>
    </div>
    <div style="font-size: 23px">
      <div style="display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; align-items: center; padding: 15px 4px; border-bottom: 2px solid var(--line)"><span class="sb">משפחת כהן</span><span>₪1,800</span><span><span class="pill" style="background: var(--mist); color: var(--peri-ink); font-size: 18px; padding: 4px 14px">✓ דווח</span></span></div>
      <div style="display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; align-items: center; padding: 15px 4px; border-bottom: 2px solid var(--line)"><span class="sb">משפחת לוי</span><span>₪360</span><span><span class="pill" style="background: var(--mist); color: var(--peri-ink); font-size: 18px; padding: 4px 14px">✓ דווח</span></span></div>
      <div style="display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; align-items: center; padding: 15px 4px; border-bottom: 2px solid var(--line)"><span class="sb">הוראת קבע</span><span>₪540</span><span><span class="pill" style="background: var(--mist); color: var(--peri-ink); font-size: 18px; padding: 4px 14px">✓ דווח</span></span></div>
      <div style="display: grid; grid-template-columns: 1.5fr 1fr 1.2fr; align-items: center; padding: 15px 4px"><span class="sb">תורם אנונימי</span><span>₪180</span><span><span class="pill" style="background: var(--mist); color: var(--peri-ink); font-size: 18px; padding: 4px 14px">✓ דווח</span></span></div>
    </div>
    <div class="between" style="margin-top: 8px; padding: 16px 4px 0; border-top: 3px dashed var(--line)">
      <span class="display" style="font-size: 28px">סה״כ</span>
      <span class="display" style="font-size: 34px; color: var(--coral-ink)">₪2,880</span>
    </div>
  </div>

  <!-- kollel attendance -->
  <div class="chip" style="left: 760px; top: 62px; width: 370px; padding: 26px 30px">
    <div class="between">
      <span class="sb" style="font-size: 23px">נוכחות · סדר א׳</span>
      <span class="display" style="font-size: 32px; color: var(--coral-ink)">18/20</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px; justify-items: center">
      <i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i>
      <i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; border: 3px solid var(--coral)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i>
      <i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; border: 3px solid var(--coral)"></i>
      <i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i><i class="disc" style="position: static; width: 34px; height: 34px; background: var(--peri)"></i>
    </div>
  </div>

  <!-- Hebrew calendar -->
  <div class="chip" style="left: 810px; top: 368px; width: 300px; padding: 24px 30px; text-align: center">
    <div class="soft" style="font-size: 20px">ראש חודש</div>
    <div class="display" style="font-size: 52px; line-height: 1.15; margin-top: 4px">א׳ בכסלו</div>
    <div class="soft" style="font-size: 19px; margin-top: 6px">זמן חורף · שיעור ב-19:30</div>
  </div>
</body>
</html>
