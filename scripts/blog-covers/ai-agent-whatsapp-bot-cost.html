<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"></head>
<body style="background: var(--blush)">
  <div class="disc" style="width: 560px; height: 560px; left: -110px; top: 250px; background: var(--coral)"></div>

  <!-- the conversation -->
  <div class="chip" style="left: 410px; top: 50px; width: 570px; height: 530px; overflow: hidden">
    <div class="window-bar" style="gap: 16px; padding: 20px 26px">
      <span style="display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: var(--peri)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff">
          <rect x="4" y="7" width="16" height="12" rx="4" />
          <rect x="11" y="2.5" width="2" height="4" rx="1" />
          <circle cx="9" cy="13" r="1.8" fill="var(--peri)" /><circle cx="15" cy="13" r="1.8" fill="var(--peri)" />
        </svg>
      </span>
      <span style="flex: 1">
        <span class="b" style="display: block; font-size: 27px">סוכן AI</span>
        <span class="soft" style="display: block; font-size: 18px; margin-top: 2px">מחובר · עונה תוך שניות</span>
      </span>
      <span class="soft sb" style="font-size: 22px">03:12</span>
    </div>
    <div style="padding: 26px; display: flex; flex-direction: column; gap: 18px; font-size: 24px; line-height: 1.4">
      <div style="align-self: flex-start; max-width: 400px; background: var(--mist); border-radius: 26px 8px 26px 26px; padding: 16px 22px">
        היי, יש לכם משהו לבר מצווה עד 300 שקל?
      </div>
      <div style="align-self: flex-end; max-width: 420px; background: var(--peri); border-radius: 8px 26px 26px 26px; padding: 16px 22px">
        בטח! מצאתי 3 מתנות שמתאימות בדיוק. לשלוח לך?
      </div>
      <div class="row" style="align-self: flex-end; gap: 14px">
        <div style="width: 104px; height: 104px; border-radius: 22px; background: var(--blush); display: grid; place-items: end center; padding-bottom: 10px; font-size: 19px" class="sb">₪180</div>
        <div style="width: 104px; height: 104px; border-radius: 22px; background: var(--mist); display: grid; place-items: end center; padding-bottom: 10px; font-size: 19px" class="sb">₪240</div>
        <div style="width: 104px; height: 104px; border-radius: 22px; background: var(--paper); border: 2px solid var(--line); display: grid; place-items: end center; padding-bottom: 10px; font-size: 19px" class="sb">₪290</div>
      </div>
    </div>
  </div>

  <!-- when it doesn't know, a person takes over -->
  <div class="chip row" style="left: 46px; top: 448px; width: 350px; padding: 20px 24px; gap: 16px; border-radius: 24px">
    <span style="position: relative; width: 62px; height: 36px; border-radius: 18px; background: var(--coral); flex: none">
      <span style="position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff"></span>
    </span>
    <span class="sb" style="font-size: 22px; line-height: 1.25">העברה לנציג אנושי</span>
  </div>

  <div class="hand" style="left: 60px; top: 96px">גם בשלוש בלילה ;)</div>
  <svg class="drawn" style="left: 300px; top: 70px" width="120" height="70" viewBox="0 0 120 70">
    <path d="M6 44 C 34 14, 70 8, 110 30 M110 30 L 94 30 M110 30 L 103 16" />
  </svg>
</body>
</html>
