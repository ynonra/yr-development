<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"></head>
<body style="background: var(--peri)">
  <!-- search results (right) -->
  <div class="chip" style="left: 650px; top: 70px; width: 480px; height: 490px; padding: 30px">
    <div class="pill" style="width: 100%; gap: 14px; padding: 14px 22px; border: 2px solid var(--line); font-size: 24px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--soft)" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 L21 21" /></svg>
      בניית אתרים בצפון
    </div>
    <div style="margin-top: 28px; padding: 18px 20px; border-radius: 20px; background: var(--blush)">
      <div class="soft" style="font-size: 18px"><bdi dir="ltr">העסק-שלכם.co.il</bdi></div>
      <div class="b" style="margin-top: 6px; font-size: 27px; color: var(--peri-ink)">העסק שלכם · אתרים ואפליקציות</div>
      <div class="bar" style="width: 92%; margin-top: 14px; background: #f3c3bd"></div>
      <div class="bar" style="width: 70%; margin-top: 10px; background: #f3c3bd"></div>
    </div>
    <div style="margin-top: 26px; padding: 0 20px">
      <div class="bar" style="width: 40%; height: 12px"></div>
      <div class="bar" style="width: 75%; height: 20px; margin-top: 10px; background: var(--mist)"></div>
      <div class="bar" style="width: 88%; margin-top: 12px"></div>
    </div>
    <div style="margin-top: 26px; padding: 0 20px">
      <div class="bar" style="width: 35%; height: 12px"></div>
      <div class="bar" style="width: 68%; height: 20px; margin-top: 10px; background: var(--mist)"></div>
    </div>
  </div>

  <!-- an AI assistant's answer (left) -->
  <div class="chip" style="left: 70px; top: 70px; width: 480px; height: 490px; padding: 30px">
    <div class="row" style="gap: 12px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="var(--coral)"><path d="M12 1.5 C 13 8, 16 11, 22.5 12 C 16 13, 13 16, 12 22.5 C 11 16, 8 13, 1.5 12 C 8 11, 11 8, 12 1.5 Z" /></svg>
      <span class="b" style="font-size: 27px">תשובה</span>
    </div>
    <div style="margin-top: 20px; font-size: 24px; line-height: 1.4">הנה כמה המלצות לבניית אתרים בצפון:</div>
    <div style="margin-top: 18px; padding: 16px 18px; border-radius: 18px; background: var(--blush); font-size: 24px">
      <span class="b">1. העסק שלכם</span>
      <div class="bar" style="width: 85%; margin-top: 12px; background: #f3c3bd"></div>
    </div>
    <div style="margin-top: 14px; padding: 6px 18px; font-size: 24px" class="row">
      <span class="soft sb" style="margin-left: 14px">2.</span><span class="bar" style="width: 62%"></span>
    </div>
    <div style="margin-top: 8px; padding: 6px 18px; font-size: 24px" class="row">
      <span class="soft sb" style="margin-left: 14px">3.</span><span class="bar" style="width: 54%"></span>
    </div>
    <div class="row" style="margin-top: 26px; gap: 10px">
      <span class="pill" style="background: var(--mist); font-size: 18px; color: var(--peri-ink)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M10 14 a5 5 0 0 0 7 0 l3-3 a5 5 0 0 0-7-7 l-1 1" /><path d="M14 10 a5 5 0 0 0-7 0 l-3 3 a5 5 0 0 0 7 7 l1-1" /></svg>
        מקור: <bdi dir="ltr">העסק-שלכם.co.il</bdi>
      </span>
    </div>
  </div>

  <!-- not either/or -->
  <div class="disc display" style="left: 525px; top: 240px; width: 150px; height: 150px; background: var(--coral); color: #fff; display: grid; place-items: center; font-size: 46px; box-shadow: 0 20px 40px -18px rgba(27,32,64,.45)">וגם</div>
</body>
</html>
