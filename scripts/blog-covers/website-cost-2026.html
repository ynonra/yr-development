<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"></head>
<body style="background: var(--mist)">
  <div class="disc" style="width: 640px; height: 640px; left: 600px; top: 190px; background: var(--peri)"></div>

  <!-- a business site, as a simple wireframe -->
  <div class="chip" style="left: 70px; top: 78px; width: 560px; height: 448px; overflow: hidden">
    <div class="window-bar">
      <span class="dot" style="background: var(--coral)"></span>
      <span class="dot" style="background: var(--peri)"></span>
      <span class="dot" style="background: var(--line)"></span>
      <span class="pill soft" style="margin-right: 14px; background: var(--paper); font-size: 18px; flex: 1">
        <bdi dir="ltr">העסק-שלכם.co.il</bdi>
      </span>
    </div>
    <div style="padding: 26px 30px">
      <div class="between">
        <span class="disc" style="position: static; display: block; width: 34px; height: 34px; background: var(--coral)"></span>
        <span class="row" style="gap: 16px">
          <span class="bar" style="width: 56px"></span><span class="bar" style="width: 56px"></span><span class="bar" style="width: 56px"></span>
        </span>
      </div>
      <div style="margin-top: 24px; background: var(--blush); border-radius: 24px; padding: 30px 30px 32px">
        <div class="bar" style="width: 290px; height: 26px; border-radius: 13px; background: var(--ink)"></div>
        <div class="bar" style="width: 230px; margin-top: 18px; background: #f3c3bd"></div>
        <div class="bar" style="width: 180px; margin-top: 12px; background: #f3c3bd"></div>
        <div style="margin-top: 22px; width: 130px; height: 42px; border-radius: 21px; background: var(--coral)"></div>
      </div>
      <div class="row" style="gap: 16px; margin-top: 22px">
        <div style="flex: 1; height: 84px; border-radius: 18px; background: var(--mist)"></div>
        <div style="flex: 1; height: 84px; border-radius: 18px; background: var(--mist)"></div>
        <div style="flex: 1; height: 84px; border-radius: 18px; background: var(--mist)"></div>
      </div>
    </div>
  </div>

  <!-- the quote: what you pay in year one (the example from the article) -->
  <div class="chip" style="left: 690px; top: 64px; width: 440px; padding: 30px 34px 28px">
    <div class="between">
      <span class="display" style="font-size: 36px">הצעת מחיר</span>
      <span class="soft" style="font-size: 20px">שנה ראשונה</span>
    </div>
    <div style="margin-top: 18px; font-size: 25px; line-height: 1">
      <div class="between" style="padding: 13px 0"><span class="sb">בניית האתר</span><span>₪6,000</span></div>
      <div class="between" style="padding: 13px 0"><span class="sb">דומיין</span><span>₪70</span></div>
      <div class="between" style="padding: 13px 0"><span class="sb">אחסון</span><span>₪600</span></div>
      <div class="between" style="padding: 13px 0"><span class="sb">תחזוקה</span><span>₪2,000</span></div>
    </div>
    <div style="margin-top: 10px; border-top: 3px dashed var(--line); padding-top: 18px" class="between">
      <span class="display" style="font-size: 30px">סה״כ</span>
      <span class="display" style="font-size: 38px; color: var(--coral-ink)">₪8,670</span>
    </div>
  </div>

  <div class="hand" style="left: 830px; top: 528px">ומה עם השנה הבאה?</div>
  <svg class="drawn" style="left: 748px; top: 444px" width="90" height="100" viewBox="0 0 90 100">
    <path d="M84 92 C 50 92, 26 78, 22 14 M22 14 L 12 28 M22 14 L 33 26" />
  </svg>
</body>
</html>
